version: '3.8'

services:
  veridian-it-agent:
    build: .
    container_name: veridian-it-agent
    ports:
      - "8000:8000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./backend/veridian.db:/app/backend/veridian.db
    restart: unless-stopped
